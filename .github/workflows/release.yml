# 推 master 或 tag v*：编 Linux/Windows release 产物
# tag 时挂到 GitHub Release；master 只留 workflow artifact
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: memos-cli-linux-x86_64
            bin: memos-cli
          - target: x86_64-pc-windows-gnu
            asset: memos-cli-windows-x86_64.exe
            bin: memos-cli.exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: mingw (windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update -y && sudo apt-get install -y mingw-w64

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: stage asset
        run: |
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          cp "$src" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}" || true
          ls -la "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
