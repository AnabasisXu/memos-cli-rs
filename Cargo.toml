[package]
name = "memos-cli"
version = "0.1.0"
edition = "2021"
description = "Unofficial usememos CLI + TUI over REST API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AnabasisXu/memos-cli-rs"
homepage = "https://github.com/AnabasisXu/memos-cli-rs"
keywords = ["memos", "usememos", "cli", "tui", "notes"]
categories = ["command-line-utilities"]
[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = "0.29"
tempfile = "3"
regex = "1"

[dev-dependencies]
# integration tests reuse regex::escape

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
